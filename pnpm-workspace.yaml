packages:
  - packages/*

# Board, Fleet and the plugin test through each other's test support, so they form development-only cycles.
ignoreWorkspaceCycles: true

overrides:
  # Recharts pins an unattested reselect release; use its attested compatible successor.
  "recharts>reselect": "catalog:"
  # `@effect/platform-node` asks for `^` its shared layer; keep that layer on
  # the catalog version so the Effect packages share one release.
  "@effect/platform-node-shared": "catalog:"

catalog:
  "@shivaedev/changes": 0.9.0
  "@shivaedev/contract": 0.35.0
  "@shivaedev/errors": 0.8.0
  "@shivaedev/form": 0.15.0
  "@shivaedev/github": 0.11.2
  "@shivaedev/http": 0.5.0
  "@shivaedev/heavy-lock": 0.9.0
  "@shivaedev/identity": 0.23.1
  "@shivaedev/local-postgres": 0.12.0
  "@shivaedev/pr-watch": 0.8.2
  "@shivaedev/quality": 0.59.0
  "@shivaedev/react": 0.39.0
  "@shivaedev/reconciler": 0.1.0
  "@shivaedev/releases": 0.8.0
  "@shivaedev/server": 0.23.0
  "@shivaedev/service": 0.6.2
  "@shivaedev/sql": 0.36.1
  "@shivaedev/test": 0.14.0
  "@shivaedev/test-sql": 0.19.0
  "@shivaedev/test-story": 0.37.1
