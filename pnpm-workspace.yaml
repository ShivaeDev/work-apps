  react-dom: 19.3.1
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  remark-directive: 4.0.0
  mdast-util-directive: 3.1.1
  remark-parse: 11.0.0
  rehype-raw: 7.0.0
  unist-util-visit: 5.2.0
  unified: 11.0.5
  happy-dom: 21.0.4
  mermaid: 12.2.0
  "@types/hast": 3.0.5
  "@types/mdast": 4.0.4
  "@types/node": 24.19.2
  "@typescript/native": npm:typescript@7.0.2
  effect: 4.0.6
