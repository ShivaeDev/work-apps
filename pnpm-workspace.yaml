  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5

catalogs:
  compiler-api:
    typescript: npm:@typescript/typescript6@6.0.2

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Framework releases must be usable together as soon as they publish.
  - "@shivaedev/*"
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
# Re-verifying every lockfile entry costs pnpm about 1 GB more memory, which
# pushes Renovate's lockfile updates past the 3 GB of the Mend-hosted runner.
# Newly resolved versions are still verified; CI re-verifies every entry with
# `--trust-lockfile=false`.
trustLockfile: true
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  msgpackr-extract: false
patchedDependencies:
  happy-dom@21.0.4: patches/happy-dom@21.0.4.patch
